<!doctype html>
<html lang="es" data-tema="panaderia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastelería Trigal</title>
<meta name="description" content="Pan desde las 6 de la mañana, tortas por encargo y el turrón de Doña Pepa de octubre.">
<meta property="og:title" content="Pastelería Trigal">
<meta property="og:description" content="Pan desde las 6 de la mañana, tortas por encargo y el turrón de Doña Pepa de octubre.">
<meta name="theme-color" content="#f9a21f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;900&display=swap">
<style>
/* Layout: capítulos de color. Portada con el producto estrella gigante que tiñe la pantalla con su color; después la lista de precios como un afiche, el panel de por qué venir, fotos como copias sobre el titular, horario en tres celdas, preguntas en fichas y un pie de fichas. Una sola letra (Epilogue), cinco tamaños. Se copia tal cual a la página del cliente. */
:root{
  color-scheme:light;
  --f:#ffffff;--fi:#0a0a0a;--b:#0a0a0a;--bi:#ffffff;--hl:#0a0a0a;
  --cab-f:#ffffff;--cab-fi:#0a0a0a;
  --f-txt:"Epilogue","Arial Black",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s-small:clamp(0.8125rem,0.79rem + 0.1vw,0.875rem);
  --s-body:clamp(1.0625rem,1rem + 0.25vw,1.1875rem);
  --s-lead:clamp(1.25rem,1.1rem + 0.7vw,1.625rem);
  --s-head:clamp(2.5rem,1.2rem + 5vw,5.5rem);
  --s-display:clamp(3.5rem,1.3rem + 7.8vw,9rem);
  --cab:68px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--f);scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;scroll-padding-top:var(--cab)}
body{margin:0;background:#ffffff;color:#0a0a0a;font-family:var(--f-txt);font-size:var(--s-body);line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cab-f);transition:background-color 300ms ease}
img{max-width:100%;display:block}
[hidden]{display:none!important}
h1,h2,h3,p,ul,ol,dl,dd,figure,table{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer}
button,a,summary{touch-action:manipulation}
button,.btn,summary{-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.wrap{max-width:1440px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.cap{background:var(--f);color:var(--fi);position:relative}
.h2{font-size:var(--s-head);font-weight:900;letter-spacing:-.04em;line-height:.92;text-wrap:balance}
.ico{width:20px;height:20px;flex:none;fill:currentColor}

/* ---------- botones: rectángulos planos, un solo color ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border:0;border-radius:0;background:var(--b);color:var(--bi);font-weight:500;font-size:var(--s-body);line-height:1;text-decoration:none;flex:none;transition:transform 160ms var(--ease-out),opacity 200ms ease}
.btn:active{transform:scale(.97)}
.btn-tinta{background:var(--fi);color:var(--f)}
.btn-papel{background:var(--f);color:var(--fi);outline:2px solid var(--fi);outline-offset:-2px}
.btn.apagado{opacity:.4;pointer-events:none}

/* ---------- cabecera: toma el color del capítulo que tiene debajo ---------- */
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cab-f);color:var(--cab-fi);transition:background-color 300ms ease,color 300ms ease}
.cab-in{display:flex;align-items:center;gap:24px;height:var(--cab)}
.marca{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;text-decoration:none}
.marca-logo{height:40px;width:auto;max-width:120px;object-fit:contain}
.marca-txt{font-weight:900;font-size:22px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:flex;gap:28px;font-weight:500;font-size:var(--s-small)}
.nav a{text-decoration:none;font-size:15px}
.btn-pedido{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:0;background:var(--cab-fi);color:var(--cab-f);font-weight:500;font-size:15px;transition:transform 160ms var(--ease-out),background-color 300ms ease,color 300ms ease}
.btn-pedido:active{transform:scale(.97)}
.contador{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;background:var(--cab-f);color:var(--cab-fi);font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;transition:background-color 300ms ease,color 300ms ease}

/* ---------- portada: el producto estrella pinta la pantalla ---------- */
.hero{overflow:hidden;transition:background-color 640ms var(--ease-in-out),color 640ms var(--ease-in-out);padding-bottom:clamp(72px,9vw,128px)}
.hero-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:center;min-height:min(calc(100svh - var(--cab) - 40px),900px);padding-block:clamp(32px,4vw,56px) 0}
.hero-txt{display:flex;flex-direction:column;gap:28px;min-width:0;position:relative;z-index:2}
.hero-txt>*{animation:subir 600ms var(--ease-out) both}
.hero-txt>:nth-child(2){animation-delay:70ms}
.hero-txt>:nth-child(3){animation-delay:140ms}
.hero-txt>:nth-child(4){animation-delay:210ms}
@keyframes subir{from{opacity:0;transform:translateY(24px)}}
.hero-h1{font-size:var(--s-display);font-weight:900;letter-spacing:-.045em;line-height:.88;text-wrap:balance}
.hero-h1.largo{font-size:clamp(2.75rem,1.2rem + 5.4vw,6.25rem)}
.hero-h1.muy-largo{font-size:clamp(2.25rem,1rem + 3.8vw,4.75rem);line-height:.95}
.hero-frase{font-size:var(--s-lead);line-height:1.35;max-width:22em;font-weight:500}
.hero-estado{display:flex;align-items:center;gap:12px;font-size:var(--s-body);font-weight:500}
.punto{position:relative;width:12px;height:12px;border-radius:50%;flex:none;background:currentColor;opacity:.45}
.abierto .punto{opacity:1;background:#18b85a}
.abierto .punto::after{content:"";position:absolute;inset:0;border-radius:50%;background:#18b85a;animation:latido 2.4s ease-out infinite}
@keyframes latido{from{transform:scale(1);opacity:.5}70%,to{transform:scale(2.6);opacity:0}}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.escenario{position:relative;min-width:0;height:clamp(440px,64vh,680px);display:grid;grid-template-rows:minmax(0,1fr) auto;outline:none}
.esc-palco{position:relative;min-height:0}
.esc-obj{position:absolute;inset:0 4% 0 0;display:grid;place-items:center;transition:translate 700ms var(--ease-out)}
.esc-fondo{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;user-select:none;-webkit-user-select:none;transition:translate 900ms var(--ease-out)}
.esc-fondo span{display:block;max-width:100%;text-align:center;font-weight:900;letter-spacing:-.055em;line-height:.84;text-wrap:balance;color:color-mix(in srgb,var(--fi) 13%,var(--f));transition:color 640ms var(--ease-in-out)}
.esc-obj svg,.esc-obj img{width:min(100%,600px);height:100%;max-height:600px;object-fit:contain;animation:flotar 5.5s var(--ease-in-out) infinite alternate}
@keyframes flotar{from{transform:translateY(-6px) rotate(-1.2deg)}to{transform:translateY(8px) rotate(1.2deg)}}
.esc-sig{position:absolute;right:calc(-1 * max(24px,env(safe-area-inset-right,0px)) - 9%);top:4%;width:30%;aspect-ratio:1;opacity:.9;transition:opacity 300ms ease}
.esc-sig svg,.esc-sig img{width:100%;height:100%;object-fit:contain}
.esc-pie{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 32px;flex-wrap:wrap;padding-top:12px}
.esc-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.esc-nombre{font-size:var(--s-lead);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.esc-precio{font-size:var(--s-lead);font-weight:500;font-variant-numeric:tabular-nums}
.esc-acciones{display:flex;align-items:center;gap:12px}
.esc-n{font-size:var(--s-small);font-weight:500;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.flecha{width:52px;height:52px;border:0;border-radius:0;background:var(--fi);color:var(--f);display:grid;place-items:center;transition:transform 160ms var(--ease-out),background-color 640ms var(--ease-in-out),color 640ms var(--ease-in-out)}
.flecha:active{transform:scale(.94)}
.flecha svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square}
.ola{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:clamp(48px,7vw,110px);color:var(--sig,#ffffff);pointer-events:none}

/* ---------- oferta del día: cinta del color de los botones con cuenta regresiva ---------- */
.oferta{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px 48px;align-items:end;background:var(--acento,#ffd249);color:var(--acento-ink,#0a0a0a);padding:clamp(28px,4vw,56px);margin-bottom:clamp(56px,7vw,104px)}
.of-txt{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
.of-t{font-size:clamp(2.25rem,1rem + 3.6vw,4.75rem);font-weight:900;letter-spacing:-.04em;line-height:.95;text-wrap:balance;max-width:100%}
.of-d{font-size:var(--s-lead);line-height:1.35;max-width:26em}
.of-btn{background:var(--acento-ink,#0a0a0a);color:var(--acento,#ffd249);margin-top:8px}
.of-reloj{display:flex;flex-direction:column;gap:12px;min-width:0}
.of-et,.of-hasta{font-size:var(--s-body);font-weight:500}
.of-cifras{display:flex;flex-wrap:wrap;gap:12px clamp(16px,2vw,28px);font-variant-numeric:tabular-nums}
.of-u{display:flex;flex-direction:column;gap:6px;min-width:2.2ch}
.of-u b{font-size:clamp(2.75rem,1.2rem + 3.6vw,5rem);font-weight:900;letter-spacing:-.04em;line-height:.9}
.of-u small{font-size:var(--s-small);font-weight:500}

/* ---------- productos: la lista como afiche ---------- */
.productos{padding-block:clamp(56px,7vw,112px) clamp(96px,10vw,176px)}
.prod-cab{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:end;padding-bottom:clamp(40px,5vw,72px)}
.prod-cab p{font-size:var(--s-lead);line-height:1.35;max-width:24em}
.afiche{display:flex;flex-direction:column}
.fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"foto nom precio acc";align-items:center;gap:6px 28px;padding-block:22px}
.fila.sin-foto{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"nom precio acc"}
.fila+.fila{border-top:2px solid color-mix(in srgb,var(--fi) 10%,transparent)}
.fila-foto{grid-area:foto;width:76px;height:76px;object-fit:cover}
.fila-nom{grid-area:nom;min-width:0;display:flex;flex-direction:column;gap:6px}
.fila-nom b{font-size:clamp(1.875rem,1rem + 2.6vw,3.5rem);font-weight:900;letter-spacing:-.04em;line-height:.95;overflow-wrap:anywhere;transition:color 200ms ease}
.fila-nom span{font-size:var(--s-body);max-width:38em}
.fila-precio{grid-area:precio;font-size:var(--s-lead);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.fila-precio small{display:block;font-size:var(--s-small);font-weight:400}
.fila-acc{grid-area:acc;justify-self:end}
.agregar{min-height:48px;padding:0 20px;border:0;background:var(--fi);color:var(--f);font-weight:500;font-size:15px;transition:transform 160ms var(--ease-out)}
.agregar:active{transform:scale(.96)}
.paso{display:inline-flex;align-items:center;background:var(--b);color:var(--bi)}
.paso button{width:46px;height:48px;border:0;background:transparent;font-size:22px;font-weight:500;line-height:1}
.paso output{min-width:26px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}

/* ---------- por qué venir: panel con forma ---------- */
.nosotros-sec{padding:20px}
.panel{background:var(--pf);color:var(--pfi);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;min-height:clamp(560px,92svh,980px);overflow:hidden;position:relative}
.panel-izq{display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:clamp(28px,4vw,56px) 0 0 clamp(28px,4vw,56px);min-width:0}
.panel-h{font-size:var(--s-head);font-weight:900;letter-spacing:-.04em;line-height:.92;max-width:9em;text-wrap:balance}
.forma{width:min(38vw,560px);aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:-12%;background:var(--forma-f,rgba(255,255,255,.12));display:grid;place-items:center}
.forma img{width:100%;height:100%;object-fit:cover}
.forma svg{width:78%;height:78%}
.panel-der{display:flex;flex-direction:column;gap:48px;padding:clamp(28px,4vw,56px) clamp(28px,4vw,56px) clamp(28px,4vw,56px) 0;justify-content:center;max-width:520px}
.punto-t{display:flex;flex-direction:column;gap:10px}
.punto-t h3{font-size:var(--s-lead);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.punto-t p{font-size:var(--s-body)}
.panel .btn{align-self:flex-start;background:var(--pb);color:var(--pbi)}

/* ---------- fotos: copias caídas sobre el titular ---------- */
.fotos-sec{min-height:clamp(560px,100svh,1000px);display:flex;flex-direction:column;align-items:center;overflow:hidden;padding-block:clamp(72px,8vw,120px) 32px;position:relative}
.fotos-h{font-size:var(--s-display);font-weight:900;letter-spacing:-.05em;line-height:.88;text-align:center;text-wrap:balance;max-width:100%}
.copias{position:relative;width:min(76vw,980px);height:min(46vw,600px);margin-top:clamp(-28px,-1.6vw,-10px);pointer-events:none}
.copia{position:absolute;width:42%;aspect-ratio:3/4;border:0;padding:clamp(6px,0.7vw,10px);background:#ffffff;pointer-events:auto;transition:transform 220ms var(--ease-out)}
.copia>*{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.copia svg{width:80%;height:80%}
.copia:nth-child(1){left:6%;top:12%;transform:rotate(-8deg)}
.copia:nth-child(2){left:44%;top:5%;transform:rotate(6deg)}
.copia:nth-child(3){left:72%;top:58%;width:26%;transform:rotate(-3deg)}
.fotos-pie{align-self:stretch;margin-top:auto;padding:40px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));font-size:var(--s-body);font-weight:500}

/* ---------- horario y dirección: tres celdas ---------- */
.visita{padding-block:clamp(72px,8vw,140px) clamp(96px,10vw,176px)}
.visita-cab{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:end;padding-bottom:48px}
.visita-cab p{font-size:var(--s-lead);line-height:1.35}
.celdas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;padding-bottom:56px}
.celda{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0}
.celda-t{font-size:var(--s-small);font-weight:500}
.celda-v{font-size:var(--s-lead);font-weight:900;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.celda .btn{margin-top:auto;align-self:flex-start}
.semana{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:8px;font-variant-numeric:tabular-nums}
.semana li{display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:168px;padding:22px 20px;border-top:4px solid var(--fi);font-size:var(--s-body)}
.semana b{font-size:var(--s-lead);font-weight:900;letter-spacing:-.02em}
.semana li span{display:block}
.semana li.hoy{background:var(--fi);color:var(--f)}
.semana li.cerrado span{opacity:.6}

/* ---------- preguntas: fichas ---------- */
.preguntas{padding-block:clamp(72px,8vw,140px)}
.preg-in{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;align-items:start}
.preg-h{position:sticky;top:calc(var(--cab) + 32px)}
.fichas{display:flex;flex-direction:column;gap:8px}
.ficha{background:color-mix(in srgb,var(--fi) 7%,var(--f));transition:background-color 220ms ease,color 220ms ease}
.ficha summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:76px;padding:20px 28px;font-size:var(--s-lead);font-weight:500;line-height:1.2}
.ficha summary::-webkit-details-marker{display:none}
.mas-menos{position:relative;width:18px;height:18px;flex:none}
.mas-menos::before,.mas-menos::after{content:"";position:absolute;left:0;top:7.5px;width:18px;height:3px;background:currentColor;transition:transform 220ms var(--ease-out)}
.mas-menos::after{transform:rotate(90deg)}
.ficha[open]{background:var(--b);color:var(--bi)}
.ficha[open] .mas-menos::after{transform:rotate(0)}
.ficha p{padding:0 28px 26px;max-width:52ch;font-size:var(--s-body)}

/* ---------- pie de fichas ---------- */
.pie{background:#0a0a0a;color:#ffffff;padding:10px}
.tablero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.tile{background:#1b1b1b;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:220px;min-width:0}
.t-frase{grid-column:span 4}
.t-frase p:first-child{font-size:var(--s-lead);line-height:1.3;font-weight:500}
.t-legal{font-size:var(--s-small);opacity:.8;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.t-legal a{display:inline-flex;align-items:center;gap:8px}
.t-nav{grid-column:span 3}
.t-nav ul{display:flex;flex-direction:column;gap:10px}
.t-nav a{text-decoration:none}
.t-hora{grid-column:span 2}
.t-hora b{font-size:var(--s-lead);font-weight:900;font-variant-numeric:tabular-nums}
.t-contacto{grid-column:span 3}
.t-contacto .redes{display:flex;flex-wrap:wrap;gap:8px}
.t-contacto .red{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500}
.t-marca{grid-column:span 8;background:#ffffff;color:#0a0a0a;min-height:320px;display:grid;place-items:center;text-align:center}
.t-marca b{font-size:var(--s-display);font-weight:900;letter-spacing:-.05em;line-height:.9;max-width:100%}
.t-accion{grid-column:span 4;background:var(--acento,#ffd249);color:var(--acento-ink,#0a0a0a);min-height:320px;text-decoration:none;transition:transform 200ms var(--ease-out)}
.t-accion:active{transform:scale(.99)}
.t-accion b{font-size:var(--s-lead);font-weight:900;line-height:1.1;max-width:9em}
.t-accion svg{width:64px;height:64px;align-self:flex-end;fill:none;stroke:currentColor;stroke-width:4;transition:transform 220ms var(--ease-out)}

/* ---------- pedido ---------- */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0a0a0a;color:#ffffff;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));transform:translateY(110%);visibility:hidden;transition:transform 220ms var(--ease-out),visibility 0s linear 220ms}
.barra.visible{transform:none;visibility:visible;transition:transform 340ms var(--ease-out),visibility 0s}
.barra span{font-weight:500;font-variant-numeric:tabular-nums;display:inline-block}
.barra .btn{min-height:46px;background:#ffffff;color:#0a0a0a}
dialog.hoja{border:0;padding:0;margin:0 0 0 auto;width:min(480px,100%);max-width:100%;height:100dvh;max-height:100dvh;background:#ffffff;color:#0a0a0a;
  transform:translateX(100%);transition:transform 260ms var(--ease-drawer),overlay 260ms allow-discrete,display 260ms allow-discrete}
dialog.hoja[open]{transform:none;transition-duration:440ms}
@starting-style{dialog.hoja[open]{transform:translateX(100%)}}
dialog::backdrop{background:rgba(0,0,0,0);transition:background-color 260ms ease,overlay 260ms allow-discrete,display 260ms allow-discrete}
dialog[open]::backdrop{background:rgba(0,0,0,.5)}
@starting-style{dialog[open]::backdrop{background:rgba(0,0,0,0)}}
.hoja-in{display:flex;flex-direction:column;height:100%}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.hoja-cab h2{font-size:clamp(1.75rem,1.4rem + 1.4vw,2.5rem);font-weight:900;letter-spacing:-.03em}
.cerrar{width:44px;height:44px;border:0;background:#f1f1f1;font-size:22px;line-height:1;transition:transform 160ms var(--ease-out)}
.cerrar:active{transform:scale(.94)}
.hoja-cuerpo{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 24px 24px;display:flex;flex-direction:column;gap:20px}
.vacio{font-size:var(--s-body)}
.lineas{display:flex;flex-direction:column}
.linea{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 16px;padding-block:14px}
.linea+.linea{border-top:2px solid #efefef}
.linea b{font-weight:500}
.linea .monto{font-variant-numeric:tabular-nums;font-weight:500}
.linea .paso{grid-column:1/-1;justify-self:start;background:#0a0a0a;color:#ffffff}
.linea .paso button{height:40px;width:42px}
.total{display:flex;justify-content:space-between;font-size:var(--s-lead);font-weight:900;font-variant-numeric:tabular-nums}
.campo{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500}
.campo input{background:#f3f3f3;border:0;padding:14px 16px;width:100%;transition:background-color 150ms ease}
.campo input:focus{outline:none;background:#e8e8e8}
.vista summary{cursor:pointer;font-size:15px;font-weight:500}
.burbuja{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5;background:#ecf8ef;padding:14px 16px;margin-top:10px}
.hoja-pie{padding:16px 24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.hoja-pie .btn{width:100%;background:#0a0a0a;color:#ffffff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;max-width:calc(100% - 32px);background:#0a0a0a;color:#ffffff;font-size:15px;font-weight:500;padding:12px 18px;pointer-events:none;opacity:0;transform:translate(-50%,16px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.toast.visible{opacity:1;transform:translate(-50%,0)}
body.con-barra .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
dialog.modal{border:0;padding:0;width:calc(100% - 32px);max-width:520px;max-height:calc(100% - 32px);overflow:auto;background:#ffffff;color:#0a0a0a;
  opacity:0;transform:scale(.96);transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out),overlay 160ms allow-discrete,display 160ms allow-discrete}
dialog.modal[open]{opacity:1;transform:none;transition-duration:240ms}
@starting-style{dialog.modal[open]{opacity:0;transform:scale(.96)}}
.modal-in{padding:28px;display:flex;flex-direction:column;gap:16px}
.modal-in h2{font-size:clamp(1.75rem,1.4rem + 1.4vw,2.5rem);font-weight:900;letter-spacing:-.03em}
.modal-pie{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.modal-pie .btn{background:#0a0a0a;color:#ffffff}
.modal-pie .btn-papel{background:#ffffff;color:#0a0a0a;outline-color:#0a0a0a}
dialog.visor{max-width:min(960px,calc(100% - 24px));background:#0a0a0a;color:#ffffff}
.visor img{width:100%;max-height:calc(100dvh - 120px);object-fit:contain;touch-action:pan-y}
.visor-barra{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.visor-barra div{display:flex;gap:6px}
.visor button{width:44px;height:44px;border:0;background:#262626;color:#ffffff;font-size:20px}

/* ---------- entradas al hacer scroll (solo si el navegador las sabe hacer; en reposo todo se ve) ---------- */
@supports (animation-timeline:view()){
  @media (prefers-reduced-motion:no-preference){
    .entra{animation:entra linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
    .entra.d1{animation-range:entry 10% entry 70%}
    .entra.d2{animation-range:entry 20% entry 80%}
    .copias .copia{animation:caer linear both;animation-timeline:view();animation-range:entry 10% cover 40%}
  }
}
@keyframes entra{from{opacity:0;transform:translateY(32px)}}
@keyframes caer{from{opacity:0;translate:0 -80px}}

@media (hover:hover) and (pointer:fine){
  .nav a:hover{text-decoration:underline;text-underline-offset:4px}
  .fila:hover .fila-nom b{color:var(--hl)}
  .btn:hover,.agregar:hover{opacity:.88}
  .flecha:hover{transform:scale(1.04)}
  .copia:hover{transform:rotate(0deg) scale(1.02)!important;z-index:2}
  .t-accion:hover svg{transform:translate(6px,-6px)}
  .ficha:not([open]):hover{background:color-mix(in srgb,var(--fi) 12%,var(--f))}
}
@media (max-width:1000px){
  .hero-in{grid-template-columns:minmax(0,1fr);gap:8px;min-height:0}
  .escenario{height:clamp(420px,110vw,620px)}
  .esc-sig{width:34%;top:2%}
  .prod-cab,.visita-cab{grid-template-columns:minmax(0,1fr)}
  .panel{grid-template-columns:minmax(0,1fr)}
  .panel-izq{padding-right:clamp(28px,4vw,56px)}
  .panel-der{padding:0 clamp(28px,4vw,56px) 40px;max-width:none}
  .forma{width:86%;margin:0 auto -18%}
  .panel-izq{display:contents}
  .panel-h{padding:clamp(28px,4vw,56px) clamp(28px,4vw,56px) 0}
  .panel-der{padding-top:0}
  .forma{order:1}
  .tablero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t-marca,.t-accion{grid-column:1/-1;min-height:180px}
  .t-nav,.t-hora{grid-column:span 1}
  .semana{grid-template-columns:repeat(4,minmax(0,1fr))}
  .t-frase,.t-contacto{grid-column:1/-1}
}
@media (min-width:1001px){ .barra{display:none} }
@media (max-width:760px){
  .hero-in{gap:0;padding-top:16px}
  .hero-txt{display:contents}
  .hero-h1{order:0}
  .escenario{order:1;height:clamp(400px,64svh,560px);margin-top:4px}
  .hero-frase{order:2;margin-top:24px}
  .hero-estado{order:3;margin-top:18px}
  .hero-ctas{order:4;margin-top:22px}
  .oferta{grid-template-columns:minmax(0,1fr);gap:28px}
  .nav{display:none}
  .marca-txt{font-size:19px}
  .cab-in{gap:12px}
  .hero-ctas .btn{flex:1 1 auto}
  .fila{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"foto nom nom" "foto precio acc";gap:10px 16px}
  .fila-foto{width:60px;height:60px;align-self:start}
  .fila.sin-foto{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nom nom" "precio acc"}
  .fila-precio{text-align:left}
  .celdas{grid-template-columns:minmax(0,1fr)}
  .semana{grid-template-columns:minmax(0,1fr);gap:0;margin-top:32px}
  .semana li{flex-direction:row;align-items:baseline;min-height:0;padding:14px 0;border-top:0;border-bottom:2px solid color-mix(in srgb,var(--fi) 14%,transparent)}
  .semana li.hoy{background:none;color:inherit}
  .semana li.hoy b::after{content:", hoy"}
  .semana b{font-size:var(--s-body);font-weight:500}
  .semana li.hoy b,.semana li.hoy p{font-weight:900}
  .semana p{text-align:right}
  .preg-in{grid-template-columns:minmax(0,1fr)}
  .preg-h{position:static}
  .nosotros-sec{padding:10px}
  .fotos-sec{min-height:0}
  .copias{width:92vw;height:84vw}
  .copia{width:52%}
  .copia:nth-child(1){left:2%;top:10%}
  .copia:nth-child(2){left:46%;top:2%}
  .copia:nth-child(3){display:none}
  .tablero{gap:6px}
  .tile{min-height:160px;padding:20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero-txt>*,.esc-obj svg,.esc-obj img,.abierto .punto::after{animation:none}
  .hero,.flecha{transition-duration:200ms}
  .toast,.barra,dialog.modal,dialog.hoja{transform:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="t-sitio">
<header class="cab" id="cab">
  <div class="wrap cab-in">
    <a class="marca" href="#inicio"><img class="marca-logo" alt="" hidden=""><span class="marca-txt" data-v="nombre"></span></a>
    <nav class="nav" aria-label="Secciones">
      <a href="#productos" data-v="textos.nav"></a>
      <a href="#visita">Horario</a>
      <a href="#visita">Ubicación</a>
      <a href="#preguntas">Preguntas</a>
    </nav>
    <button type="button" class="btn-pedido" id="abrir-pedido" aria-label="Ver tu pedido"><span data-v="textos.pedidoCorto"></span><span class="contador" id="contador">0</span></button>
  </div>
</header>

<main>
  <section class="cap hero" id="inicio" data-cap="hero" aria-labelledby="h1">
    <div class="wrap hero-in">
      <div class="hero-txt">
        <h1 class="hero-h1 encaja" id="h1" data-v="nombre"></h1>
        <p class="hero-frase" data-v="eslogan"></p>
        <p class="hero-estado" id="estado"><span class="punto" aria-hidden="true"></span><span id="estado-txt"></span></p>
        <div class="hero-ctas">
          <a class="btn" href="#productos" data-v="textos.cta"></a>
          <a class="btn btn-papel js-wa" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6a3.5 3.5 0 0 1-3.5 3.5H11l-5 4.5V16a2.5 2.5 0 0 1-2-2.5z"></path></svg>WhatsApp</a>
        </div>
      </div>
      <div class="escenario" id="escenario" role="region" aria-roledescription="carrusel" aria-label="Productos estrella" tabindex="0">
        <div class="esc-palco">
          <p class="esc-fondo" id="esc-fondo" aria-hidden="true"></p>
          <div class="esc-obj" id="esc-obj"></div>
          <div class="esc-sig" id="esc-sig" aria-hidden="true"></div>
        </div>
        <div class="esc-pie">
          <div class="esc-info" aria-live="polite"><p class="esc-nombre" id="esc-nombre"></p><p class="esc-precio" id="esc-precio"></p></div>
          <div class="esc-acciones">
            <button type="button" class="btn btn-tinta" id="esc-agregar">Agregar</button>
            <button type="button" class="flecha" id="esc-ant" aria-label="Producto anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
            <span class="esc-n" id="esc-n"></span>
            <button type="button" class="flecha" id="esc-sig-btn" aria-label="Producto siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
          </div>
        </div>
      </div>
    </div>
    <svg class="ola" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C 180 120 360 120 540 78 S 900 10 1080 44 S 1340 110 1440 66 V120 H0 Z" fill="currentColor"></path></svg>
  </section>

  <section class="cap productos" id="productos" data-cap="catalogo" aria-labelledby="prod-t">
    <div class="wrap">
      <div class="oferta" id="oferta" hidden="">
        <div class="of-txt">
          <h2 class="of-t encaja" id="of-t"></h2>
          <p class="of-d" id="of-d"></p>
          <a class="btn of-btn" id="of-btn" href="#">Lo quiero</a>
        </div>
        <div class="of-reloj" role="timer" aria-labelledby="of-et">
          <p class="of-et" id="of-et">Termina en</p>
          <p class="of-cifras" id="of-cifras" aria-hidden="true"></p>
          <p class="of-hasta" id="of-hasta"></p>
        </div>
      </div>
      <div class="prod-cab"><h2 class="h2 encaja entra" id="prod-t" data-v="textos.titulo"></h2><p class="entra d1" data-v="textos.sub"></p></div>
      <ul class="afiche" id="afiche"></ul>
    </div>
  </section>

  <section class="cap nosotros-sec" data-cap="catalogo" aria-labelledby="nos-t">
    <div class="panel">
      <div class="panel-izq">
        <h2 class="panel-h encaja entra" id="nos-t" data-v="nosotros"></h2>
        <figure class="forma entra d1" id="forma"></figure>
      </div>
      <div class="panel-der" id="puntos"></div>
    </div>
  </section>

  <section class="cap fotos-sec" id="fotos" data-cap="fotos" aria-labelledby="fotos-t">
    <h2 class="fotos-h encaja" id="fotos-t" data-v="textos.fotos"></h2>
    <div class="copias" id="copias"></div>
    <p class="fotos-pie" id="fotos-pie"></p>
  </section>

  <section class="cap visita" id="visita" data-cap="visita" aria-labelledby="vis-t">
    <div class="wrap">
      <div class="visita-cab"><h2 class="h2 encaja entra" id="vis-t">Horario y dirección</h2><p class="entra d1" data-v="referencia"></p></div>
      <div class="celdas">
        <div class="celda entra"><p class="celda-t">Hoy</p><p class="celda-v" id="hoy-horas"></p><p id="estado2"></p></div>
        <div class="celda entra d1"><p class="celda-t">Dónde</p><p class="celda-v" data-v="direccion"></p><a class="btn btn-tinta js-mapa" href="#" target="_blank" rel="noopener">Cómo llegar</a></div>
        <div class="celda entra d2"><p class="celda-t">Pagos</p><p class="celda-v" id="pagos-txt"></p><a class="btn btn-tinta js-wa" href="#">Escríbenos</a></div>
      </div>
      <ol class="semana" id="semana" aria-label="Horario de la semana"></ol>
    </div>
  </section>

  <section class="cap preguntas" id="preguntas" data-cap="preguntas" aria-labelledby="preg-t">
    <div class="wrap preg-in">
      <h2 class="h2 preg-h encaja" id="preg-t">Preguntas frecuentes</h2>
      <div class="fichas" id="fichas"></div>
    </div>
  </section>
</main>

<footer class="pie" id="pie" data-cap="pie">
  <div class="tablero">
    <div class="tile t-frase"><p data-v="eslogan"></p>
      <div class="t-legal">
        <a id="reclamos" href="#" target="_blank" rel="noopener" hidden=""><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5zM8 12h8v-1.6H8zm0 4h8v-1.6H8z"></path></svg>Libro de Reclamaciones</a>
        <span>Página hecha con Vitrina</span>
      </div>
    </div>
    <nav class="tile t-nav" aria-label="Pie de página"><ul><li><a href="#inicio">Inicio</a></li><li><a href="#productos" data-v="textos.nav"></a></li><li><a href="#visita">Horario y dirección</a></li><li><a href="#preguntas">Preguntas</a></li></ul></nav>
    <div class="tile t-hora"><span data-v="ciudad"></span><b id="hora-local"></b></div>
    <div class="tile t-contacto"><span data-v="direccion"></span><div class="redes" id="redes"></div></div>
    <div class="tile t-marca"><b class="encaja" data-v="nombre"></b></div>
    <a class="tile t-accion js-wa" href="#"><b data-v="textos.enviar"></b><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 50 50 14M22 14h28v28"></path></svg></a>
  </div>
</footer>

<div class="barra" id="barra" aria-hidden="true" inert="">
  <span id="barra-txt"></span>
  <button type="button" class="btn" id="barra-btn">Ver pedido</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="hoja" id="dlg-pedido" aria-labelledby="ped-t">
  <div class="hoja-in">
    <div class="hoja-cab"><h2 id="ped-t" data-v="textos.pedido"></h2><button type="button" class="cerrar" data-cerrar="" aria-label="Cerrar">×</button></div>
    <div class="hoja-cuerpo">
      <p class="vacio" id="ped-vacio" data-v="textos.vacio"></p>
      <ul class="lineas" id="ped-lineas"></ul>
      <p class="total" id="ped-total-fila"><span id="ped-total-et">Total</span><span id="ped-total"></span></p>
      <div id="ped-campos" style="display:flex;flex-direction:column;gap:14px">
        <label class="campo">Tu nombre<input id="cliente-nombre" autocomplete="given-name" placeholder="Para saber quién escribe"></label>
        <label class="campo"><span data-v="textos.nota"></span><input id="cliente-nota" autocomplete="off"></label>
        <details class="vista"><summary>Ver el mensaje que se envía</summary><p class="burbuja" id="ped-burbuja"></p></details>
      </div>
    </div>
    <div class="hoja-pie"><a class="btn" id="enviar" href="#" data-v="textos.enviar"></a></div>
  </div>
</dialog>

<dialog class="modal" id="dlg-msg" aria-labelledby="msg-t">
  <div class="modal-in">
    <h2 id="msg-t">Así le llega el mensaje</h2>
    <p class="burbuja" id="msg-burbuja"></p>
    <p id="msg-nota"></p>
    <div class="modal-pie">
      <button type="button" class="btn" id="msg-copiar">Copiar mensaje</button>
      <form method="dialog"><button class="btn btn-papel">Cerrar</button></form>
      <span id="msg-copiado" aria-live="polite"></span>
    </div>
  </div>
</dialog>

<dialog class="modal visor" id="dlg-foto" aria-label="Foto ampliada">
  <img id="visor-img" alt="">
  <div class="visor-barra"><span id="visor-n"></span><div><button type="button" id="visor-ant" aria-label="Foto anterior">‹</button><button type="button" id="visor-sig" aria-label="Foto siguiente">›</button><form method="dialog" style="display:contents"><button aria-label="Cerrar">×</button></form></div></div>
</dialog>
</template>
<script>
/* Vitrina · motor de la página. Pinta el negocio desde sus datos, mueve el carrusel y arma el pedido.

const grageas = [[150, 178, '#f53fd6'], [176, 170, '#3fb6f5'], [204, 162, '#ffffff'], [230, 156, '#46c46a'], [258, 150, '#ffd249'], [140, 192, '#ffd249'], [168, 188, '#46c46a'], [196, 180, '#f53fd6'], [222, 174, '#3fb6f5'], [250, 168, '#ffffff'], [278, 162, '#f53fd6'], [186, 200, '#ffffff'], [214, 194, '#ffd249'], [242, 188, '#f53fd6'], [270, 182, '#46c46a'], [300, 176, '#3fb6f5'], [232, 206, '#3fb6f5'], [260, 200, '#ffffff'], [288, 194, '#ffd249'], [312, 186, '#46c46a']]
  .map(([x, y, c], i) => `<rect x="${x}" y="${y}" width="12" height="5" rx="2.5" fill="${c}" transform="rotate(${(i * 37) % 180} ${x + 6} ${y + 2.5})"/>`).join('');
const DIBUJOS = {

/* ---------- formato ---------- */
const H12 = (() => { try { const o = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions(); return o.hourCycle ? /h1[12]/.test(o.hourCycle) : !!o.hour12; } catch (e) { return true; } })();
const pad = n => String(n).padStart(2, '0');
function hora(m) {
  let h = Math.floor(m / 60) % 24; const mi = m % 60;
  if (!H12) return `${pad(h)}:${pad(mi)}`;
  const suf = h < 12 ? 'a. m.' : 'p. m.'; h = h % 12 || 12;
  return mi ? `${h}:${pad(mi)} ${suf}` : `${h} ${suf}`;
}
const aLas = m => (/^0?1(:| )/.test(hora(m)) ? 'a la ' : 'a las ') + hora(m);
function dinero(n) { const m = (D.moneda || 'S/').trim() || 'S/'; return `${m} ${Math.abs(n - Math.round(n)) < 0.005 ? Math.round(n) : n.toFixed(2)}`; }
function valor(ruta) { return ruta.split('.').reduce((o, k) => (o == null ? '' : o[k]), D) || ''; }

/* ---------- color ---------- */
const hex = c => /^#[0-9a-f]{6}$/i.test(c || '');
function lum(h) { const n = parseInt(h.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const tintaPara = f => contraste(f, '#0a0a0a') >= contraste(f, '#ffffff') ? '#0a0a0a' : '#ffffff';
function acento() { const a = hex(D.color) ? D.color : D.acento[0]; return [a, hex(D.color) ? tintaPara(a) : D.acento[1]]; }
function varsCapitulo(el, f, fi) {
  const [a, ai] = acento();
  const usarAcento = contraste(a, f) >= 1.8;
  el.style.setProperty('--f', f); el.style.setProperty('--fi', fi);
  el.style.setProperty('--b', usarAcento ? a : fi); el.style.setProperty('--bi', usarAcento ? ai : f);
  el.style.setProperty('--hl', contraste(a, f) >= 3 ? a : fi);
}

/* ---------- horario en la zona del negocio ---------- */
function ahora() {
  try {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: D.zona || undefined, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    const g = t => (p.find(x => x.type === t) || {}).value;
    return { dia: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')), min: (Number(g('hour')) % 24) * 60 + Number(g('minute')) };
  } catch (e) { const d = new Date(); return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() }; }
}
const turnos = d => ((D.horario && D.horario[d]) || []).filter(t => Array.isArray(t) && t[1] > t[0]).slice().sort((a, b) => a[0] - b[0]);
const rangos = d => turnos(d).map(t => `${hora(t[0])} – ${hora(t[1])}`).join(' y ') || 'Cerrado';
function estado() {
  const { dia, min } = ahora(), hoy = turnos(dia);
  const actual = hoy.find(t => min >= t[0] && min < t[1]);
  if (actual) {
    const resta = actual[1] - min, sig = hoy.find(t => t[0] >= actual[1]);
    let txt = resta <= 60 ? `Abierto, cierra pronto: ${aLas(actual[1])}` : `Abierto ahora, cierra ${aLas(actual[1])}`;
    if (sig && resta <= 60) txt += ` y vuelve ${aLas(sig[0])}`;
    return { abierto: true, txt };
  }
  const prox = hoy.find(t => t[0] > min);
  if (prox) return { abierto: false, txt: hoy.some(t => t[1] <= min) ? `Cerrado por ahora, vuelve ${aLas(prox[0])}` : `Cerrado, abre hoy ${aLas(prox[0])}` };
  for (let i = 1; i <= 7; i++) { const dd = (dia + i) % 7, t = turnos(dd); if (t.length) return { abierto: false, txt: `Cerrado, abre ${i === 1 ? 'mañana' : 'el ' + DIAS[dd].toLowerCase()} ${aLas(t[0][0])}` }; }
  return { abierto: false, txt: 'Cerrado' };
}

function colorEstrella(it) { const f = hex(it.color) ? it.color : D.capitulos.catalogo[0]; return [f, tintaPara(f)]; }
function pintarEscenario(dir) {
  const es = estrellas(), hero = $('#inicio'), esc_ = $('#escenario');
  esc_.hidden = !es.length;
  if (!es.length) { varsCapitulo(hero, D.capitulos.catalogo[0], D.capitulos.catalogo[1]); return; }
  ind = ((ind % es.length) + es.length) % es.length;
  const it = es[ind], sig = es[(ind + 1) % es.length];
  const [f, fi] = colorEstrella(it);
  varsCapitulo(hero, f, fi);
  const obj = $('#esc-obj'), nuevo = figura(it), fondo = $('#esc-fondo'), turno = ++turnoEsc;
  const ponerFondo = () => { fondo.innerHTML = `<span>${esc(it.nombre)}</span>`; ajustarFondo(); };
  if (dir && !quieto() && obj.firstElementChild && obj.animate) {
    const sale = (el, x, extra) => el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${x}%) ${extra}` }], { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' });

function finOferta() {

  // «demo»: la oferta del modelo que se manda a los negocios siempre termina mañana a las 9 p. m.
  if (o.modo === 'demo') return Date.parse(diaLima(1) + 'T21:00:00-05:00');
  if (o.modo === 'fecha') { const t = Date.parse(String(o.fin || '') + ':00-05:00'); return isNaN(t) ? null : t; }
  const { dia, min } = ahora(), t = turnos(dia);

  return Date.now() + (t[t.length - 1][1] - min) * 60000 - new Date().getSeconds() * 1000;
}
function textoHasta(fin) {

  if (o.modo !== 'fecha' && o.modo !== 'demo') { const t = turnos(ahora().dia); return 'Hoy, hasta ' + aLas(t[t.length - 1][1]).slice(2); }
  const f0 = o.modo === 'demo' ? diaLima(1) + 'T21:00' : String(o.fin);
